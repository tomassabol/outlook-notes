# Publishes the Outlook add-in's static files (task pane code, icons, manifest.xml) to GitHub Pages.
# Only code is published. Notes and labels stay in Outlook on each computer.
name: Deploy Outlook add-in

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'addin/**'
      - 'build-addin.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/addin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build add-in
        run: node build-addin.mjs
        env:
          ADDIN_BASE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-addin
      - id: deployment
        uses: actions/deploy-pages@v4
