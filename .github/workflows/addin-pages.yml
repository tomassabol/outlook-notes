# Publishes the Outlook add-in's static files (task pane code, icons, manifest.xml) to GitHub Pages.
# Only code is published. Notes and labels stay in Outlook on each computer.
name: Deploy Outlook add-in

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'addin/**'
      - 'build-addin.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/addin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build add-in
        run: node build-addin.mjs
        env:
          ADDIN_BASE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-addin

  # Deploy is a separate job, as in GitHub's Pages template: deploying in the same job right after
  # the upload can fail with "No artifacts named github-pages were found".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
